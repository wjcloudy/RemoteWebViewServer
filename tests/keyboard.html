<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Display keyboard preview</title>
<style>
body{margin:0;background:#fafafa;color:#212121;font:16px Arial,sans-serif}
main{width:min(360px,calc(100% - 48px));margin:36px auto}h1{font-size:24px;margin-bottom:28px}
label{display:block;font-size:14px;margin:20px 0 7px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #888;border-radius:5px;font:inherit;background:white}
.login{display:block;margin:22px 0;width:100%;height:44px;border:0;background:#03a9f4;color:white;border-radius:4px;font:inherit}
p{font-size:14px;color:#666;line-height:1.5}
</style>
<main><h1>Log in</h1><p>Keyboard preview · 480 × 480 display</p><demo-login></demo-login></main>
<script>
customElements.define('demo-field',class extends HTMLElement{
 connectedCallback(){const r=this.attachShadow({mode:'open'});const style=document.createElement('style');style.textContent='input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #888;border-radius:5px;font:16px Arial;background:white}label{display:block;font:14px Arial;margin:20px 0 7px}';r.append(style);const label=document.createElement('label');label.textContent=this.getAttribute('label');const input=document.createElement('input');input.type=this.getAttribute('type')||'text';input.setAttribute('aria-label',label.textContent);input.id='field';label.htmlFor='field';r.append(label,input)}
});
customElements.define('demo-login',class extends HTMLElement{
 connectedCallback(){const r=this.attachShadow({mode:'open'});for(const [label,type] of [['Username','text'],['Password','password']]){const f=document.createElement('demo-field');f.setAttribute('label',label);f.setAttribute('type',type);r.append(f)}const b=document.createElement('button');b.textContent='Log in';b.style.cssText='margin-top:22px;width:100%;height:44px;border:0;background:#03a9f4;color:white;border-radius:4px;font:16px Arial';r.append(b)}
});
</script><script src="../keyboard/keyboard.js"></script></html>
