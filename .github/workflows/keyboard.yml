name: Native input image

on:
  pull_request:
  workflow_dispatch:
    inputs:
      existing_image:
        description: 'Optional tested keyboard-<commit> tag to promote without rebuilding'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:run
      - run: npm run build
      - run: git diff --exit-code -- dist
      - run: npm run test:browser
        env:
          KEYBOARD_TEST_CHROMIUM: /usr/bin/google-chrome
      - run: docker build -f dockerfile.keyboard -t keyboard-check .
      - run: docker run --rm --init --mount "type=bind,source=$PWD/tests/startup.browser.mjs,target=/app/startup.browser.mjs,readonly" keyboard-check node /app/startup.browser.mjs

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: keyboard-test-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish tested image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXISTING_IMAGE: ${{ inputs.existing_image }}
        run: |
          set -euo pipefail
          repository="ghcr.io/wjcloudy/remote-webview-server"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [ -n "$EXISTING_IMAGE" ]; then
            [[ "$EXISTING_IMAGE" =~ ^keyboard-[0-9a-f]{12}$ ]] || { printf 'Invalid tested image tag\n' >&2; exit 1; }
            image="$repository:$EXISTING_IMAGE"
          else
            image="$repository:keyboard-${GITHUB_SHA:0:12}"
            docker build -f dockerfile.keyboard --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" .
            docker push "$image"
          fi
          # Copy the existing manifest, retaining its exact digest. This channel
          # is for keyboard testing; upstream latest/beta are independent.
          docker buildx imagetools create --prefer-index=false --tag "$repository:keyboard-test" "$image"
          printf 'Published `%s` on `%s:keyboard-test`\n' "$image" "$repository" >> "$GITHUB_STEP_SUMMARY"
