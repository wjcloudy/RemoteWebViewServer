name: Copy existing keyboard images

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Public GHCR repository to copy immutable keyboard images from'
        type: string
        required: true
      tags:
        description: 'Comma-separated immutable keyboard-<commit> tags'
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  copy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Copy immutable images without rebuilding
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" =~ ^ghcr.io/[a-z0-9][a-z0-9-]*/remote-webview-server$ ]] || exit 1
          destination="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/remote-webview-server"
          IFS=',' read -r -a tags <<< "$SOURCE_TAGS"
          [ "${#tags[@]}" -gt 0 ] && [ "${#tags[@]}" -le 20 ] || exit 1
          for tag in "${tags[@]}"; do
            [[ "$tag" =~ ^keyboard-[0-9a-f]{12}$ ]] || exit 1
          done
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "${tags[@]}"; do
            docker buildx imagetools create --prefer-index=false --tag "$destination:$tag" "$SOURCE_REPOSITORY:$tag"
          done
